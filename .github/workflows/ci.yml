name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # Windows is the reason this is a matrix. rpt reads the console device
    # directly, binds a socket, and shells out to git, and all three differ
    # there. Claiming support without a runner that proves it is how a tool
    # ends up broken on a platform nobody tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # git identity is required: the verifier and attestation suites create
      # fixture repositories and commit into them.
      - name: configure git identity for fixture repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rpt ci"

      - run: pnpm typecheck

      # Coverage thresholds are configured in vitest.config.ts; the job fails
      # when any of the four drops below 80. Only measured once, on Linux: the
      # other runners are there to prove the code works, not to re-measure it.
      - run: pnpm test:cov
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm test
        if: matrix.os != 'ubuntu-latest'

      - run: pnpm build
